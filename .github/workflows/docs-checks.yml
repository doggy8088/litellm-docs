name: Docs checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  social-cards:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:social-cards
      - run: npm run test:optimize-images
      - run: npm run test:lens
  writing-style:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-writing-style.js docs blog release_notes
  structure:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check for retired master-key prefix
        run: |
          status=0
          git grep -nI -F -- "sk-12""34" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Retired master-key prefix found"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python3 scripts/check-docs.py docs
